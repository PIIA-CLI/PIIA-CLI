[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "piia-cli"
version = "0.1.0"
description = "Generate legally-structured PIIA documents by analyzing prior code repositories against a target repository, carving out pre-existing IP as Prior Inventions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "PIIA-CLI contributors" }]
keywords = [
    "piia",
    "legal",
    "intellectual-property",
    "prior-inventions",
    "code-analysis",
    "cli",
    "llm",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
pdf = ["weasyprint>=61"]
repowise = ["repowise>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
all = [
    "python-docx>=1.1",
    "weasyprint>=61",
    "repowise>=0.40",
]

[project.urls]
Homepage = "https://github.com/PIIA-CLI/PIIA-CLI"
Repository = "https://github.com/PIIA-CLI/PIIA-CLI"
Issues = "https://github.com/PIIA-CLI/PIIA-CLI/issues"
Changelog = "https://github.com/PIIA-CLI/PIIA-CLI/blob/main/CHANGELOG.md"

[project.scripts]
piia = "piia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/piia"]

[tool.hatch.build.targets.sdist]
include = ["src/piia", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root must be importable so tests can share helpers via
# 'from tests.conftest import make_repo'. Without this, pytest only puts the
# tests/ directory itself on sys.path and that import fails.
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.mypy]
python_version = "3.11"
packages = ["piia"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
