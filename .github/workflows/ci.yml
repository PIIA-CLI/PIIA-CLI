name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI may reach a model endpoint: the deterministic layer and the
  # fake-transport tests must cover everything that runs here.
  PIIA_USE_REPOWISE: "false"
  NO_COLOR: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docx]"

      - name: Configure git identity (the tests build real repositories)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Test
        run: pytest --cov=piia --cov-report=term-missing

      - name: Smoke-test the CLI contract
        shell: bash
        run: |
          piia version --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='success', d"
          piia analyze --schema | python -c "import json,sys; d=json.load(sys.stdin); assert d['properties']['data']['title']=='AnalyzeData', d"
          piia schema --all > /dev/null
          piia doctor --skip-llm --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['data']['summary']['failures']==0, d"
          # Human mode must never emit JSON, and JSON mode must be one clean document.
          piia version -o human | grep -q "piia 0"

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: published schema drift
        run: python scripts/export_schemas.py --check
      - name: ruff format check
        run: ruff format --check src tests || true
      - name: mypy
        run: mypy

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify templates are packaged
        run: |
          python -m zipfile -l dist/*.whl | grep -q "piia/templates/piia.md.j2"
          python -m zipfile -l dist/*.whl | grep -q "piia/templates/piia.html.j2"
      - name: Build GitHub Action image
        run: |
          docker build --tag piia-cli-action:test .
          docker run --rm --entrypoint piia piia-cli-action:test version --json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
